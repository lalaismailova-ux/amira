<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Миссия Амиры</title><style>body{margin:0;background:linear-gradient(130deg,#f9dff1,#e5ddff,#fff1cc);font:22px system-ui;color:#422959}main{max-width:760px;margin:25px auto;padding:15px}.card{background:#fffdfd;border:3px solid #dfc4f3;border-radius:30px;padding:clamp(20px,5vw,40px);box-shadow:0 12px 30px #67439024}h1{font-size:clamp(34px,6vw,52px);line-height:1.15}h2{font-size:32px}.center{text-align:center}.emoji{font-size:70px}.btn{display:block;width:100%;margin:13px 0;padding:18px;border:2px solid #d3b9ec;border-radius:18px;background:#f3e9ff;color:#422959;font:inherit;font-weight:700;cursor:pointer;text-align:left}.btn:hover{background:#e2cefc}.primary{background:#7951b1;color:white;text-align:center;border-color:#7951b1}.primary:hover{background:#67409d}.correct{background:#d6f5dd!important}.wrong{background:#ffe0e4!important}.pill{font-size:17px;background:#f1e1ff;border-radius:30px;padding:8px 16px;display:inline-block}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:17px;font-weight:700}.bar{background:#eadbf3;height:14px;border-radius:20px;margin:18px 0}.fill{height:100%;background:#b56bd7;border-radius:20px}.question{font-size:29px;font-weight:700;background:#fff0f8;padding:20px;border-radius:20px;margin:20px 0}.feedback{background:#f3e8ff;border-radius:18px;padding:17px;margin:15px 0}.word{display:inline-block;width:auto;margin:6px}.selected{background:#d5f0df}.certificate{background:#fff7df;border:5px double #d9b55b;border-radius:20px;padding:22px;text-align:center}p{line-height:1.5}li{margin:12px 0}@media print{body{background:white}.noprint{display:none}.card{box-shadow:none}}</style></head><body><main id="app"></main><script>
const L=[
['🦉','Охотница за частями речи','Найди существительные, прилагательные и глаголы.',[
['Найди все глаголы: «Рыжая белка прыгнула и спряталась в дупле».',['Рыжая','белка','прыгнула','и','спряталась','в','дупле'],[2,4],'Прыгнула и спряталась — действия.'],
['Какое слово — прилагательное?',['лес','прохладный','гуляет'],1,'Прохладный — какой?'],
['Какое слово — существительное?',['внимательно','девочка','рисует'],1,'Девочка — кто?'],
['«Деревья шумели». Слово «шумели» — это...',['глагол','прилагательное','существительное'],0,'Шумели — что делали?']]],
['⏳','Машина времени','Узнай, когда происходит действие.',[
['«Вчера Амира читала». Время глагола?',['настоящее','прошедшее','будущее'],1,'Читала — уже было.'],
['«Сейчас птицы поют». Время глагола?',['будущее','настоящее','прошедшее'],1,'Поют — происходит сейчас.'],
['«Завтра будем рисовать». Время глагола?',['прошедшее','будущее','настоящее'],1,'Будем рисовать — будущее время из двух слов.'],
['«Мальчик написал письмо». Время глагола?',['прошедшее','настоящее','будущее'],0,'Написал — действие уже произошло.']]],
['🪄','Исправь заклинание','Выбирай правильное написание.',[
['Как правильно?',['Девочка стараеться.','Девочка старается.'],1,'Что делает? Старается — без ь.'],
['Как правильно?',['Нужно учится.','Нужно учиться.'],1,'Что делать? Учиться — с ь.'],
['Как правильно?',['ночьной','ночной'],1,'В сочетании чн мягкий знак не пишется.'],
['Как правильно?',['девочка','девочька'],0,'В сочетании чк мягкий знак не пишется.'],
['Как правильно?',['вдалике','вдалеке'],1,'Вдалеке — запоминаем написание.']]],
['📜','Спаси предложения','Союзы, запятые и прямая речь.',[
['Где правильно стоит запятая?',['Утро было солнечным, но холодным.','Утро было, солнечным но холодным.'],0,'Перед но нужна запятая.'],
['Какое слово — союз?',['красивый','но','бежит'],1,'Но — союз.'],
['Разговор двух человек — это...',['диалог','полилог'],0,'Диалог — разговор двух людей.'],
['Разговор четырёх человек — это...',['монолог','полилог'],1,'Полилог — разговор нескольких людей.'],
['Как оформлена прямая речь правильно?',['Мама сказала «Пора домой».','Мама сказала: «Пора домой».'],1,'После слов автора ставится двоеточие.']]],
['🏰','Тайна абзацев','Разделяй текст на смысловые части.',[
['Текст сначала о лесе, потом о белке. Где начать новый абзац?',['Перед рассказом о белке.','После каждого слова.'],0,'Новая мысль — новый абзац.'],
['Зачем нужны абзацы?',['Чтобы разделять мысли.','Чтобы не ставить точки.'],0,'Абзацы помогают понять текст.'],
['Как правильно?',['Каждое предложение обязательно с нового абзаца.','Несколько предложений об одной мысли могут быть в одном абзаце.'],1,'Абзац объединяет предложения одной микротемы.']]]];
let lv=0,qi=0,points=0,mistakes=[],chosen=[],locked=false;const app=document.getElementById('app');const total=L.reduce((a,x)=>a+x[3].length,0);
function home(){app.innerHTML=`<div class="card center"><div class="emoji">🏰✨📚</div><span class="pill">Русский язык • 5 класс</span><h1>Миссия Амиры:<br>Королевство слов</h1><p>Помоги вернуть волшебные правила! Пройди 5 уровней, собери звёздочки и получи грамоту.</p><button class="btn primary" onclick="start()">Начать приключение ✨</button><p>⭐ 10 звёзд за верный ответ • ${total} заданий</p></div>`}
function start(){lv=0;qi=0;points=0;mistakes=[];intro()}
function intro(){let l=L[lv];app.innerHTML=`<div class="card center"><div class="emoji">${l[0]}</div><span class="pill">Уровень ${lv+1} из 5</span><h1>${l[1]}</h1><p>${l[2]}</p><button class="btn primary" onclick="ask()">Начать уровень ➜</button></div>`}
function ask(){locked=false;chosen=[];let l=L[lv],t=l[3][qi],done=L.slice(0,lv).reduce((a,x)=>a+x[3].length,0)+qi;let multi=Array.isArray(t[2]);app.innerHTML=`<div class="card"><div class="top"><span>${l[0]} ${l[1]}</span><span>⭐ ${points}</span></div><div class="bar"><div class="fill" style="width:${100*done/total}%"></div></div><span class="pill">Вопрос ${qi+1} из ${l[3].length}</span><div class="question">${t[0]}</div>${multi?'<p>Выбери все подходящие слова:</p>':''}${t[1].map((s,i)=>`<button id="o${i}" class="btn ${multi?'word':''}" onclick="${multi?'toggle':'answer'}(${i})">${s}</button>`).join('')}${multi?'<button id="check" class="btn primary" onclick="check()">Проверить</button>':''}<div id="msg"></div><div id="next"></div></div>`}
function toggle(i){if(locked)return;chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i];document.getElementById('o'+i).classList.toggle('selected')}
function answer(i){if(locked)return;let t=L[lv][3][qi];finish(i===t[2]);t[1].forEach((_,j)=>{let e=document.getElementById('o'+j);e.disabled=true;if(j===t[2])e.classList.add('correct');else if(j===i)e.classList.add('wrong')})}
function check(){if(locked)return;let t=L[lv][3][qi],ok=chosen.length===t[2].length&&chosen.every(i=>t[2].includes(i));t[1].forEach((_,j)=>{let e=document.getElementById('o'+j);e.disabled=true;e.classList.remove('selected');if(t[2].includes(j))e.classList.add('correct');else if(chosen.includes(j))e.classList.add('wrong')});document.getElementById('check').disabled=true;finish(ok)}
function finish(ok){locked=true;let t=L[lv][3][qi];if(ok)points+=10;else mistakes.push({level:L[lv][1],task:t[0]});document.getElementById('msg').innerHTML=`<div class="feedback"><b>${ok?'🌟 Верно! +10 звёзд':'💜 Запомним правило!'}</b><p>${t[3]}</p></div>`;document.getElementById('next').innerHTML='<button class="btn primary" onclick="next()">Продолжить ➜</button>'}
function next(){qi++;if(qi<L[lv][3].length)return ask();lv++;qi=0;if(lv<L.length)return intro();results()}
function results(){let topics=[...new Set(mistakes.map(x=>x.level))];app.innerHTML=`<div class="card"><div class="certificate"><div class="emoji">👑🌟</div><h1>Грамота Амиры</h1><p>За смелость и старание в Королевстве слов!</p><h2>⭐ ${points} звёзд</h2><p>${points/10} из ${total} правильных ответов</p></div><h2>Результаты для репетитора</h2><p><b>Повторить:</b> ${topics.length?topics.join(', '):'Все темы усвоены без ошибок!'}</p>${mistakes.length?`<details><summary>Задания с ошибками (${mistakes.length})</summary><ol>${mistakes.map(x=>`<li>${x.level}: ${x.task}</li>`).join('')}</ol></details>`:''}<p>Чтобы сохранить результат, сделайте скриншот или распечатайте страницу.</p><div class="noprint"><button class="btn primary" onclick="window.print()">🖨️ Распечатать результат</button><button class="btn" onclick="home()">🔁 Играть снова</button></div></div>`}
home();</script></body></html>
